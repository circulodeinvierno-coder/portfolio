    <title>__SITE_TITLE__</title>

    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="__OG_IMAGE_ALT__" />

    <meta name="twitter:title" content="__SITE_TITLE__" />
    <meta name="twitter:description" content="__SITE_DESCRIPTION__" />
    <meta name="twitter:image" content="__OG_IMAGE__" />

    <!-- Datos estructurados -->
    <script type="application/ld+json" id="seo-json-ld">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "__SITE_URL__/#website",
            "url": "__SITE_URL__/",
            "name": "Circulo Invierno",
            "description": "__SITE_DESCRIPTION__",

          {
            "@type": "Person",
            "@id": "__SITE_URL__/#person",
            "name": "Cristóbal",
            "alternateName": "Circulo Invierno",
            "url": "__SITE_URL__/",
            "image": "__OG_IMAGE__",
            "description": "Portafolio de ilustración, fanzines y experimentos de Cristóbal (Circulo Invierno), desde Viña del Mar, Chile.",
            "address": {
              "@type": "PostalAddress",
              "addressLocality": "Viña del Mar",
              "addressCountry": "CL"
            },
            "sameAs": ["https://www.instagram.com/circulodeinvierno/"],
            "knowsAbout": ["Ilustración digital", "Fanzine", "Autoedición", "Diseño editorial"]
          }
        ]
      }
    </script>

        </p>
